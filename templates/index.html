<!DOCTYPE html>
<html lang="id" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <title>AI Agent Karyawan</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}?v=10"
    />
  </head>
  <body>
    <div class="app">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <h3>AI Agent</h3>
        <button onclick="toggleTheme()">🌗 Toggle Theme</button>
        <p class="hint">Mockup Sidebar</p>
      </aside>

      <!-- CHAT AREA -->
      <main class="chat-area">
        <header class="chat-header">AI Agent Karyawan</header>

        <div id="chat" class="chat-box"></div>

        <div class="chat-input">
          <input
            type="text"
            id="input"
            placeholder="Tanya data karyawan..."
            onkeydown="if(event.key==='Enter') sendMessage()"
          />
          <button onclick="sendMessage()">Kirim</button>
        </div>
      </main>
    </div>

    <script>
      function formatResponse(text) {
        if (text.includes("Nama:") && text.includes("Umur:")) {
          const rows = text.split("\n").map((line) => {
            const [key, value] = line.split(":");
            return `<tr><th>${key}</th><td>${value}</td></tr>`;
          });

          return `<table class="data-table">${rows.join("")}</table>`;
        }
        return `<p>${text}</p>`;
      }

      async function sendMessage() {
        const input = document.getElementById("input");
        const chat = document.getElementById("chat");
        const message = input.value.trim();
        if (!message) return;

        chat.innerHTML += `
          <div class="message user">
            <div class="bubble user-bubble">${message}</div>
          </div>
        `;

        input.value = "";

        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message }),
        });

        const data = await response.json();

        chat.innerHTML += `
          <div class="message ai">
            <div class="bubble ai-bubble">
              ${formatResponse(data.response)}
            </div>
          </div>
        `;

        chat.scrollTop = chat.scrollHeight;
      }

      function toggleTheme() {
        const html = document.documentElement;
        html.dataset.theme = html.dataset.theme === "dark" ? "light" : "dark";
      }
    </script>
  </body>
</html>
