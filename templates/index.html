<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>AI Agent Karyawan</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <div class="chat-container">
      <h2>AI Agent Karyawan</h2>

      <div id="chat" class="chat-box"></div>

      <input type="text" id="input" placeholder="Tanya data karyawan..." />
      <button onclick="sendMessage()">Kirim</button>
    </div>

    <script>
      async function sendMessage() {
        const input = document.getElementById("input");
        const chat = document.getElementById("chat");
        const message = input.value;

        if (!message) return;

        chat.innerHTML += `<div class="message user">You: ${message}</div>`;
        input.value = "";

        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message }),
        });

        const data = await response.json();
        chat.innerHTML += `<div class="message ai">AI: ${data.response}</div>`;
        chat.scrollTop = chat.scrollHeight;
      }
    </script>
  </body>
</html>
